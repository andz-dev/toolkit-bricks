name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate demo profile
        run: npm run validate -- profiles/demo/catalog.json
      - name: Build single file
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit-bricks-single-file
          path: dist/toolkit-bricks.html

  browser:
    runs-on: ubuntu-latest
    # The official image has the exact browser and fonts, so screenshots are comparable between runs.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Compare screenshots when baselines exist
        run: |
          if [ -d tests/visual/__screenshots__ ]; then echo "VISUAL_COMPARE=1" >> "$GITHUB_ENV"; fi
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-screens
          path: test-results/screens/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
